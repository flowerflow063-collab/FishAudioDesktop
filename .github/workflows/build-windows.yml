name: Build Fish Audio Desktop for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Comprobar sintaxis
        shell: pwsh
        run: |
          python -m py_compile app.py audio_mixer.py studio_recorder.py
      - name: Crear EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name FishAudioDesktop `
            --collect-all imageio_ffmpeg `
            --hidden-import soundcard `
            app.py
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Crear instalador
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" FishAudioDesktop.iss
      - name: Guardar EXE
        uses: actions/upload-artifact@v4
        with:
          name: FishAudioDesktop-Windows-EXE
          path: dist/FishAudioDesktop.exe
      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: FishAudioDesktop-Windows-Installer
          path: installer/FishAudioDesktop-Setup.exe
